# What this dbt project is and where its pieces are.
name: lakehouse
version: "1.0.0"
profile: lakehouse        # name of the profiles.yml block that says which database to connect to

model-paths: ["models"]   # the .sql files that become tables
test-paths: ["tests"]     # "singular" tests: a SELECT that returns rows only if there is an error
macro-paths: ["macros"]

models:
  lakehouse:
    silver:
      +materialized: table   # each model is stored as a table (not as a view)
      +schema: silver        # dbt appends it to the default schema: it generates `main_silver` (the checks accept both)
    gold:
      +materialized: table
      +schema: gold          # generates `main_gold`
