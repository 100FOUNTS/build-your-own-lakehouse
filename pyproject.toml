[project]
name = "build-a-pump-failure-lakehouse"
version = "0.1.0"
description = "Guided exercise: build a predictive-maintenance lakehouse from raw files (bronze, silver, gold, model, Dagster, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2",
    # transformation (steps 3 and 4)
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    # model (step 5)
    "scikit-learn>=1.5",
    # orchestration (step 6)
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    # serving (step 7)
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.9", "ipykernel>=6.29"]

# This is not an installable package: the code is imported with PYTHONPATH=src (the Makefile sets it).
# That way we avoid the "hidden" .pth problem on macOS.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["checks"]
markers = ["bonus: extra challenges, they do not block the step"]
addopts = "-q -p no:cacheprovider -m 'not bonus'"

[tool.ruff]
line-length = 110
target-version = "py312"
